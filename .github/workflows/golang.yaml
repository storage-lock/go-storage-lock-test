name: Go package

on:
  pull_request:
  push:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Download dependencies after installing the selected Go toolchain.
      - name: Prepare dependencies
        run: go mod download

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install RocksDB (cgo dependency)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y librocksdb-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test core semantics
        run: go test -race -count=1 ./...
