name: Go package

on:
  pull_request:
  push:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: go-storage-lock-test

      - name: Prepare dependencies
        working-directory: go-storage-lock-test
        run: go mod download

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install RocksDB (cgo dependency)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y librocksdb-dev

      - name: Build
        working-directory: go-storage-lock-test
        run: go build ./...

      - name: Vet
        working-directory: go-storage-lock-test
        run: go vet ./...

      # 外部服务后端（redis/etcd/mysql/mongo/s3 等）由环境变量保护自动 skip，
      # 这里跑的是不需要外部服务的本地后端语义套件。
      - name: Test
        working-directory: go-storage-lock-test
        run: go test -race -count=1 ./...
