name: Go package

on:
  pull_request:
  push:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: go-storage-lock-test

      # The integration module consumes published storage backends. Keep CI independent
      # of organization-private sibling repository credentials.
      - name: Prepare dependencies
        working-directory: go-storage-lock-test
        run: go mod download

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install RocksDB (cgo dependency)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y librocksdb-dev

      - name: Build
        working-directory: go-storage-lock-test
        run: go build ./...

      - name: Vet
        working-directory: go-storage-lock-test
        run: go vet ./...

      - name: Test core semantics
        working-directory: go-storage-lock-test
        run: go test -race -count=1 ./...

      - name: Build private backend integration adapters
        working-directory: go-storage-lock-test/integration
        run: go test -race -run '^$' .
